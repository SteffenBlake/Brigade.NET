name: Publish package group

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      group:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: artifacts/packages
      - name: Authenticate to NuGet with GitHub OIDC
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: SteffenBlake
      - name: Publish validated packages and wait for feed availability
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
          PACKAGE_GROUP: ${{ inputs.group }}
        run: python3 eng/release.py publish --version "$RELEASE_VERSION" --group "$PACKAGE_GROUP"
