name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

# Serialize attempts for a single version. Different suite versions use distinct packages.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate release tag and prerelease status
        id: release
        run: python3 eng/release.py event

  validate:
    needs: plan
    uses: ./.github/workflows/validate.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  core:
    needs: [plan, validate]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      group: core

  libraries:
    needs: [plan, core]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        group: [mise, partie, expo]
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      group: ${{ matrix.group }}

  extensions:
    needs: [plan, libraries]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      group: extensions

  complete:
    needs: [plan, extensions]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: artifacts/packages
      - name: Verify all published packages
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: python3 eng/release.py verify --version "$RELEASE_VERSION"
      - name: Attach packages and provenance manifest to the GitHub Release
        if: ${{ github.event.release.immutable != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: gh release upload "$RELEASE_VERSION" artifacts/packages/*.nupkg artifacts/packages/release-manifest.json --clobber
