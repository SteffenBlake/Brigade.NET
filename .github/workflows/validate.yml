name: Validate suite

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Check Docker
        run: docker info
      - name: Test release tooling
        run: python3 -m unittest discover -s eng/tests -v
      - name: Pack and inspect all public packages
        run: python3 eng/release.py pack --version "$RELEASE_VERSION"
      - name: Build and test consumers against local NuGet packages
        run: python3 eng/release.py smoke --version "$RELEASE_VERSION"
      - name: Run unit and integration tests
        run: python3 eng/release.py test --version "$RELEASE_VERSION"
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain validated release packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages
          path: artifacts/packages
          if-no-files-found: error
          retention-days: 90
