<text x="446.2" y="360" text-anchor="middle" font-size="13" font-family="sans-serif">10 µs</text>
<line x1="632.5" y1="100" x2="632.5" y2="335" stroke="#ddd"/>
<text x="632.5" y="360" text-anchor="middle" font-size="13" font-family="sans-serif">100 µs</text>
<line x1="818.8" y1="100" x2="818.8" y2="335" stroke="#ddd"/>
<text x="818.8" y="360" text-anchor="middle" font-size="13" font-family="sans-serif">1,000 µs</text>
<line x1="1005.0" y1="100" x2="1005.0" y2="335" stroke="#ddd"/>
